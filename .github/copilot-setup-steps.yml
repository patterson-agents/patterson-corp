# .github/copilot-setup-steps.yml -- environment setup for the GitHub Copilot coding agent.
#
# [TBD: GitHub currently reads this configuration from .github/workflows/copilot-setup-steps.yml
# to actually activate it for the Copilot coding agent's ephemeral environment. This file is
# committed at the path this change's scope specifies; whether and when to duplicate or move it
# under .github/workflows/ is a follow-up decision, not made here.]
#
# Plugin scripts are zero-dependency: no dependency install, every script runs directly via
# `node scripts/<name>.ts` using Node's native TypeScript type stripping. The `site/`
# toolchain is the documented exception -- a pinned, socket-gated `package.json` and
# `bun.lock` for the branded doc-site build, scoped to `site/` only. See
# docs/decisions/0005-branded-doc-sites.md.
name: "Copilot Setup Steps"

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  copilot-setup-steps:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Confirm zero-dependency setup
        run: |
          echo "Plugin scripts: no package.json, no node_modules, no install step by design."
          echo "site/ is the documented exception (ADR 0005) -- scoped to site/ only."
          node --version
