name: Manifest sync

on:
  push:
    paths:
      - .claude-plugin/marketplace.json
      - .github/plugin/marketplace.json
  pull_request:
    paths:
      - .claude-plugin/marketplace.json
      - .github/plugin/marketplace.json

jobs:
  check-manifest-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Verify manifests are byte-identical
        run: sh scripts/sync-manifests.sh --check
