name: Deploy static site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Configure Pages
        uses: actions/configure-pages@v6

      # The content generator is zero-dependency TypeScript run directly by Node, exactly
      # like every other script in this repository. CI pins the same Node 24 that ci.yml
      # does rather than relying on whatever the runner ships.
      - name: Set up Node 24
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      # site/ is the one documented exception to the zero-dependency invariant
      # (docs/decisions/0005-branded-doc-sites.md). --frozen-lockfile makes the committed
      # site/bun.lock authoritative: an install that would change it fails here instead of
      # silently drifting from the versions ADR 0005 supply-chain scored.
      - name: Install the site toolchain
        run: bun install --frozen-lockfile
        working-directory: site

      # Almost every page is derived from Markdown elsewhere in the repository and is not
      # tracked, so it has to be generated before the build. Running this as its own step
      # keeps a content failure distinguishable from a build failure.
      - name: Generate the derived documentation pages
        run: node scripts/build-site-content.ts

      - name: Build the Starlight site
        run: bun run build
        working-directory: site

      # The deployed artifact is a composition, not a replacement. Before this site
      # existed the whole docs/ tree was published at the artifact root, so /assets/...,
      # /diagrams/..., /architecture/... and /decisions/... all resolve today and must keep
      # resolving. Each docs/ subdirectory is therefore republished at its original
      # root-level path AND under /docs/, merging into the generated site rather than
      # overwriting it.
      #
      # The one path whose content deliberately changes is /, which now serves the
      # Starlight site. The page it replaces is still published, at /docs/.
      - name: Compose the Pages artifact
        run: |
          set -eu
          rm -rf _site
          cp -r site/dist _site
          mkdir -p _site/docs
          cp -r docs/. _site/docs/
          for dir in docs/*/; do
            name=$(basename "$dir")
            mkdir -p "_site/$name"
            cp -r "$dir." "_site/$name/"
          done
          # Astro emits _astro/; Pages does not run Jekyll for uploaded artifacts, but the
          # marker makes that independent of the deploy path.
          touch _site/.nojekyll
          echo "composed artifact:"
          ls -1 _site

      - name: Verify the composed artifact
        run: |
          set -eu
          for page in \
            _site/index.html \
            _site/docs/index.html \
            _site/docs/diagrams/layered-model.svg \
            _site/diagrams/layered-model.svg \
            _site/assets/banner.webp \
            _site/architecture/layered-settings.md
          do
            if [ ! -f "$page" ]; then
              echo "missing from the composed artifact: $page" >&2
              exit 1
            fi
          done
          echo "every preserved path is present"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: '_site'

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
