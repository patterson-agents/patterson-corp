# .github/secret_scanning.yml -- this repository's own secret-scanning exclusions.
#
# plugins/patterson-engineering/hooks/tests/ deliberately contains synthetic AWS access
# keys and database connection strings (payload-secret.json, payload-connstring.json, and
# siblings) to exercise the pretooluse-guard.ts hook's own detection logic. They are fake,
# but they are shaped exactly like the real thing so the hook's tests are meaningful. This
# file must exist and be present on the default branch BEFORE secret scanning push
# protection is ever enabled on this repository, or the first push after enabling it blocks
# on these fixtures. See SECURITY.md.
paths-ignore:
  - "plugins/patterson-engineering/hooks/tests/**"
