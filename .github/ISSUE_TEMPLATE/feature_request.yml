name: Feature request
description: Propose an enhancement to an existing plugin, skill, agent, hook, or script.
title: "[feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        For a **new plugin** or a **new skill inside an existing plugin**, use the
        dedicated proposal templates instead -- they collect the provenance information a
        change of that size needs. This template is for enhancing something that already
        exists.

  - type: input
    id: location
    attributes:
      label: Affected path
      description: The existing plugin, skill, agent, hook, or script this would change.
      placeholder: plugins/<plugin>/skills/<skill>
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: What's missing or limited today
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
      description: What you'd want to see instead. Link an OpenSpec change under `openspec/changes/` if you have already started one.
    validations:
      required: true

  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: This does not require a new top-level plugin or a new skill directory (if it does, use the proposal templates instead).
          required: false
