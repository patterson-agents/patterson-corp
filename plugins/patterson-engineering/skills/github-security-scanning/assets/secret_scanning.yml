# Template: .github/secret_scanning.yml
#
# Install this FIRST, before enabling secret scanning push protection on the repository.
# Enabling push protection while a repository still carries deliberately synthetic
# credentials in its test fixtures blocks the author on their own test data.
#
# Install to:  .github/secret_scanning.yml   (repository root, not this skill's directory)
#
# Scope: this file suppresses secret-scanning *alerts* for the listed paths. It is the only
# secret-scanning setting expressible as a file in the repository. Enabling secret scanning
# and push protection themselves are server-side settings; see the skill's SKILL.md for the
# documented `gh api` call, which a human runs after this file is merged.

paths-ignore:
  # Patterson engineering hook fixtures. These payloads carry synthetic AWS keys and
  # connection strings on purpose: they are the inputs that prove the PreToolUse guard
  # detects credentials. They are not live secrets.
  - "plugins/patterson-engineering/hooks/tests/**"

  # Add one entry per additional fixture location that carries synthetic credentials.
  # Keep the list minimal and specific. A broad exclusion silences real findings too.
  #
  # Every exclusion added here should be justified in the pull request that adds it.
